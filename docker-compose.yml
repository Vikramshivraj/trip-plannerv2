version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: tripplanner-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tripplanner
      MYSQL_USER: tripplanner
      MYSQL_PASSWORD: tripplanner_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./tripplanner.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:6.2-alpine
    container_name: tripplanner-redis
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: tripplanner-qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    container_name: tripplanner-backend
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=mysql
      - DB_USER=tripplanner
      - DB_PASSWORD=tripplanner_pass
      - DB_NAME=tripplanner
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-travel_knowledge}
      - RAG_MIN_SCORE=${RAG_MIN_SCORE:-0.35}
    depends_on:
      - mysql
      - redis
      - qdrant

  worker:
    build: ./backend
    container_name: tripplanner-worker
    command: ["node", "worker.js"]
    environment:
      - DB_HOST=mysql
      - DB_USER=tripplanner
      - DB_PASSWORD=tripplanner_pass
      - DB_NAME=tripplanner
      - REDIS_URL=redis://redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mysql
      - redis

  frontend:
    build: ./frontend
    container_name: tripplanner-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api

volumes:
  db_data:
  qdrant_data:



